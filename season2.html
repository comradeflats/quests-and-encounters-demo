<!doctype html><html><head><meta charset="utf-8"><title>Quests and Encounters · Season 2 · The Long Night</title>
<link rel="stylesheet" href="s2/base.css">
<style>
  #fac{z-index:2;left:30px;top:76px;font-size:14px;color:#cbbd9f;display:flex;gap:18px}
  #fac .h{color:#e0806a;letter-spacing:2px}#fac .away{opacity:.4;font-style:italic}
  #goal .q{font-size:13.5px;color:#cbbd9f;font-style:italic}#goal .q b{font-weight:normal;color:#fbe9bd;font-style:normal}
  #party .fallen{opacity:.45;text-decoration:line-through}
</style></head><body>
<div id="stage">
  <canvas id="c" width="427" height="240"></canvas>
  <div id="topshade"></div>
  <div id="fade"></div>
  <div id="top" class="hud"><div id="res"></div><div id="goal"></div></div>
  <div id="party" class="hud"></div>
  <div id="fac" class="hud"></div>
  <div id="toast" class="hud"></div>
  <div id="story" class="hud"></div>
  <div id="strike"></div>
  <div id="panel" class="hud"></div>
  <div id="snd" class="hud">♪ sound on · M to mute · hold Space to see the whole scene</div>
</div>
<script src="audio.js"></script>
<script src="s2/art.js"></script>
<script src="s2/content.js"></script>
<script>
/* ================================================================ Season 2 · The Long Night (browser build)
   Rules and flow. Content (places, council matters, costs) is in s2/content.js; art is exported by
   tools/art/s2_export.py. Same look and sound as Season 1; the scene art is one image per scene plus the
   four Company sprites. #bot=1 plays a season by itself and writes a log into <pre id="botlog">. */
const A = window.Audio2 || {mood() {}, ambience() {}, sfx() {}, toggle() {}, start() {}};
const cv = document.getElementById('c'), ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
const CW = 427, CH = 240, SY = 60;
const sleep = ms => new Promise(r => setTimeout(r, ms / (window.SPEED || 1)));
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const $ = id => document.getElementById(id);

const BG = {}; for (const k of S2ART.scenes) { const i = new Image(); i.src = 's2/' + k + '.png'; BG[k] = i; }
const MEM = {}; for (const k in S2ART.members) { const i = new Image(); i.src = 's2/' + k + '.png'; MEM[k] = {...S2ART.members[k], img: i}; }
const MEMBERS = ['m_banner', 'm_cleric', 'm_captain', 'm_tracker'];
const CO = {
  m_banner: {short: 'Wren', stats: {Might: 2, Wits: 3, Faith: 2, Stealth: 1}},
  m_cleric: {short: 'Aldous', stats: {Might: 1, Wits: 3, Faith: 5, Stealth: 1}},
  m_captain: {short: 'Brannoc', stats: {Might: 5, Wits: 2, Faith: 1, Stealth: 1}},
  m_tracker: {short: 'Ness', stats: {Might: 2, Wits: 4, Faith: 1, Stealth: 5}},
};
const nm = m => CO[m].short;
const RES = ['Bread', 'Timber', 'Stone', 'Coin', 'Ward'];

/* ------------------------------------------------------------------ state */
const G = {day: 1, scene: 'works', res: {}, people: 0, militia: 0, party: {}, loyal: {}, hurt: {}, fac: {}, built: {}, unlocked: {},
  work: 'fish', q: {}, flags: {}, intel: [], visits: {}, once: {}, carry: {}, log: [], view: null, busy: false, builtToday: false, usedToday: {}};
const SAVE_KEY = 'qe.chronicle';

function newSeason() {
  Object.assign(G.res, S2.start.res); G.people = S2.start.people; G.militia = S2.start.militia;
  for (const m of MEMBERS) { G.party[m] = 'ok'; G.loyal[m] = 3; }
  G.loyal.m_banner = null;
  for (const k in S2.factions) G.fac[k] = {here: S2.factions[k].here, h: S2.factions[k].hearts, gifted: false};
  for (const k in S2.districts) { G.built[k] = 0; G.unlocked[k] = !!S2.districts[k].open; }
  G.q.season = 'open';
  const c = loadChronicle();   // Season 1's chronicle, if there is one; otherwise this default Company
  G.from = c ? 'chronicle' : 'default';
  if (c && c.season === 1) {
    const co = c.company || {};
    for (const m of MEMBERS) {
      if (co.party && co.party[m]) G.party[m] = co.party[m] === 'gone' ? 'gone' : 'ok';
      if (co.loyal && co.loyal[m] != null) G.loyal[m] = co.loyal[m];
    }
    const r = (c.stores || {}).res || {};
    G.res.Stone += Math.min(3, r.Stone || 0); G.res.Coin += Math.min(3, r.Coin || 0); G.res.Ward = Math.max(1, Math.min(3, r.Ward || 1));
    const spare = Math.max(0, ((c.result || {}).maxDay || 14) - ((c.result || {}).endDay || 14));
    G.res.Bread += spare; G.res.Stone += Math.min(2, spare);
    if ((c.ravenwick || {}).refugeesIn) { G.people += 3; G.militia += 1; G.flags.sergeant = 1; }
    const fl = (c.world || {}).flags || {};
    const keys = Object.keys(fl).join(' ');
    G.flags.shrineDark = /shrine.*(broke|desecr|rob)/i.test(keys) && !/pray/i.test(keys);
    G.flags.bridgeHeld = /highway.*(paid|pay)/i.test(keys) ? 'the highwaymen you paid off, grown bold' : /highway.*(fought|fight|driven)/i.test(keys) ? 'strangers in masks: the highwaymen are gone' : null;
  }
}
function loadChronicle() { try { const c = JSON.parse(localStorage.getItem(SAVE_KEY + '.s1') || localStorage.getItem(SAVE_KEY) || 'null'); return c && c.format === 'quests-and-encounters/chronicle' && c.season === 1 && (c.result || {}).win ? c : null } catch (e) { return null } }
function saveChronicle(result) {
  const c = {format: 'quests-and-encounters/chronicle', version: 1, season: 2, title: 'The Long Night', savedAt: new Date().toISOString(),
    result, company: {party: G.party, loyal: G.loyal, hurt: G.hurt}, stores: {res: G.res}, city: {people: G.people, militia: G.militia, built: G.built,
      factions: G.fac}, world: {flags: G.flags, quests: G.q, intel: G.intel}};
  try { if (!window.BOT) { localStorage.setItem(SAVE_KEY, JSON.stringify(c)); localStorage.setItem(SAVE_KEY + '.s2', JSON.stringify(c)); } } catch (e) {}
  return c;
}

const here = m => G.party[m] === 'ok';
const has = m => here(m) && !G.hurt[m];
const can = c => !c || Object.entries(c).every(([k, v]) => G.res[k] >= v);
const pay = c => { if (c) for (const k in c) G.res[k] -= c[k]; };
const cost = c => Object.entries(c).map(([k, v]) => `${v} ${k}`).join(', ');
const builtN = () => Object.values(G.built).filter(Boolean).length;
const need = () => Math.ceil(G.people / 5);
const facHere = () => Object.keys(G.fac).filter(k => G.fac[k].here);
const S = k => S2.factions[k];

/* ------------------------------------------------------------------ effects */
function fx(e, notes = []) {
  if (!e) return notes;
  if (e.res) for (const k in e.res) { const before = G.res[k]; G.res[k] = Math.max(0, G.res[k] + e.res[k]); const d = G.res[k] - before; if (d) notes.push(`${d > 0 ? '+' : ''}${d} ${k}`); }
  if (e.people) { G.people = Math.max(0, G.people + e.people); notes.push(`${e.people > 0 ? '+' : ''}${e.people} people`); }
  if (e.militia) { G.militia = Math.max(0, G.militia + e.militia); notes.push(`+${e.militia} militia`); }
  if (e.fac) for (const k in e.fac) heart(k, e.fac[k], notes);
  if (e.hurt) for (const m of e.hurt) if (here(m)) { G.hurt[m] = 1; notes.push(`${nm(m)} is wounded`); A.sfx('hurt'); }
  if (e.flag) Object.assign(G.flags, e.flag);
  if (e.unlock) for (const d of e.unlock) unlock(d, notes);
  if (e.intel) for (let i = 0; i < e.intel; i++) reveal(notes);
  const up = e.res && Object.values(e.res).some(v => v > 0), down = e.res && Object.values(e.res).some(v => v < 0);
  if (up) A.sfx(e.res.Coin > 0 ? 'coin' : 'gain'); else if (down) A.sfx('loss');
  return notes;
}
function heart(k, d, notes) {
  const f = G.fac[k]; if (!f || !f.here || !d) return;
  f.h = Math.max(0, Math.min(5, f.h + d));
  notes.push(`${S(k).short} ${d > 0 ? '♥+' + d : '♥' + d}`);
  if (k === 'faithful' && f.h >= 3) unlock('chapel', notes);
  if (f.h >= 5 && !f.gifted) { f.gifted = true; notes.push(S(k).gift); gift(k); }
  if (f.h === 0) { f.here = false; G.people = Math.max(0, G.people - 3); notes.push(`${S(k).name} leave Ravenwick, and take their people with them (−3 people)`); }
}
function gift(k) {
  if (k === 'faithful') { G.hurt = {}; G.res.Ward += 2; }
  if (k === 'guild') G.res.Coin += 4;
  if (k === 'fen') { G.res.Bread += 3; G.flags.boats = 1; G.flags.iceRoad = 1; }
}
function unlock(d, notes) { if (!G.unlocked[d]) { G.unlocked[d] = true; notes.push(`${S2.districts[d].building} can now be raised in ${S2.districts[d].name}`); } }
function arrive(k, notes) { if (G.fac[k].here) return; G.fac[k].here = true; G.people += 3; notes.push(`${S(k).name} come to Ravenwick (+3 people). ${S(k).speaker} will sit on the council.`);
  if (k === 'guild') unlock('square', notes); if (k === 'fen') unlock('stores', notes); }
function reveal(notes) { const left = Object.keys(S2.threats).filter(t => !G.intel.includes(t)); if (!left.length) return; const t = left[0]; G.intel.push(t); notes.push(`You know of ${S2.threats[t].name}`); }

/* ------------------------------------------------------------------ drawing */
const SNOWY = {works: 1, square: 1, chapel: 1, yard: 1, stores: 1, crossroads_w: 0.4, cairn: 1, hermit: 3, thornmere: 0.3, toll_bridge: 1, monastery: 0.4,
  frozen_wreck: 2, barrow: 0.4, thin_ice: 0, siege_warning: 1, siege_long_dark: 0.6};
const FLAKES = Array.from({length: 160}, () => ({x: Math.random() * CW, y: Math.random() * CH, v: .2 + Math.random() * .5, w: Math.random() * 6}));
function draw(t) {
  const bg = BG[G.scene];
  if (bg && bg.complete) ctx.drawImage(bg, 0, 0); else { ctx.fillStyle = '#07060a'; ctx.fillRect(0, 0, CW, CH); }
  for (const m of MEMBERS) if (here(m) && MEM[m] && MEM[m].img.complete) {
    const s = MEM[m]; ctx.globalAlpha = G.hurt[m] ? .75 : 1; ctx.drawImage(s.img, s.x, s.y); ctx.globalAlpha = 1;
  }
  if (here('m_cleric')) {   // the lantern's light, drawn live so it belongs to whatever scene we are in
    const s = MEM.m_cleric, lx = s.x + s.w - 2, ly = s.y + 6, f = .85 + .15 * Math.sin(t / 180);
    const g = ctx.createRadialGradient(lx, ly, 1, lx, ly, 26 * f); g.addColorStop(0, 'rgba(255,200,120,.55)'); g.addColorStop(1, 'rgba(255,160,80,0)');
    ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(lx - 30, ly - 30, 60, 60); ctx.globalCompositeOperation = 'source-over';
  }
  const sn = SNOWY[G.scene] || 0, ember = G.scene === 'siege_assault';
  if (sn || ember) for (const f of FLAKES) {
    if (ember) { f.y -= f.v * 1.2; f.x += Math.sin(t / 400 + f.w) * .3; if (f.y < 0) { f.y = CH; f.x = Math.random() * CW; } ctx.fillStyle = f.w > 3 ? '#ffb050' : '#ff6a2a'; }
    else { f.y += f.v; f.x += sn > 1 ? f.v * sn : Math.sin(t / 900 + f.w) * .25; if (f.y > CH) { f.y = 0; f.x = Math.random() * CW; } if (f.x > CW) f.x = 0; ctx.fillStyle = 'rgba(240,244,250,.8)'; }
    if (Math.random() < (ember ? 1 : Math.min(1, sn))) ctx.fillRect(f.x | 0, f.y | 0, 1, 1);
  }
}
function loop(t) { draw(t); requestAnimationFrame(loop); }

/* ------------------------------------------------------------------ panel & HUD */
function show(v) { G.view = v; render(); }
function busy(b) { G.busy = b; $('panel').classList.toggle('busy', b); }
async function goScene(scene, mood, amb) {
  if (G.scene === scene) { if (mood) A.mood(mood); return; }
  const f = $('fade'); f.style.opacity = 1; await sleep(500); G.scene = scene; if (mood) A.mood(mood); if (amb) A.ambience(amb); f.style.opacity = 0; await sleep(300);
}
let toastT; function toast(s) { const el = $('toast'); el.textContent = s; el.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => el.style.opacity = 0, 2600); }
function fitPanel() { const p = $('panel'); p.classList.remove('d1', 'd2'); for (const d of ['d1', 'd2']) { if (p.scrollHeight <= p.clientHeight + 1) return; p.classList.remove('d1'); p.classList.add(d); } }
function render() {
  const v = G.view, p = $('panel');
  if (v) {
    const barks = (v.barks || []).map(([w, l]) => `<div class="bark">${w ? `<b>${w}:</b> ` : ''}${l}</div>`).join('');
    p.innerHTML = (v.kind ? `<div class="kind">${v.kind}</div>` : '') + (v.title ? `<h1>${v.title}</h1>` : '') + `<div class="body">${v.body}</div>${barks}<div class="cap">${v.cap || ''}</div>` +
      v.ch.map((c, i) => {
        const lockWho = c.who && !has(c.who), lock = c.off || lockWho || !can(c.c);
        const why = c.off ? c.off : lockWho ? (here(c.who) ? `${nm(c.who)} is wounded` : `${nm(c.who)} is gone`) : !can(c.c) ? 'Needs ' + cost(c.c) : '';
        return `<a class="ch ${lock ? 'off' : ''}" data-i="${i}">${c.who ? `<span class="who">${nm(c.who)}:</span> ` : ''}${c.t}${(why || c.s) ? `<small>${why || c.s}</small>` : ''}</a>`;
      }).join('');
    p.querySelectorAll('.ch').forEach(a => { const c = v.ch[+a.dataset.i]; a.onclick = () => choose(c); a.onmouseenter = () => A.sfx('hover'); });
    fitPanel();
  } else p.innerHTML = '';
  $('res').innerHTML = RES.map(k => `<span class="${k === 'Bread' && G.res.Bread < need() ? 'lo' : ''}">${k} <b>${G.res[k]}</b></span>`).join('') +
    `<span>People <b>${G.people}</b></span>` + (G.militia ? `<span>Militia <b>${G.militia}</b></span>` : '');
  const left = S2.siegeDay - G.day;
  const dl = Object.keys(S2.districts).filter(d => G.built[d]).map(d => S2.districts[d].building);
  $('goal').innerHTML = `<div class="big">Day ${Math.min(G.day, S2.maxDay)} of ${S2.maxDay} · ${left > 0 ? left + (left === 1 ? ' day' : ' days') + ' to Midwinter' : 'Midwinter'}</div>` +
    `<div class="sm">${builtN() >= 3 ? '<span class="done">✓ A City</span>' : `<span class="now">Districts ${builtN()} of 3</span>`}${dl.length ? ' · ' + dl.join(', ') : ''}</div>` + questLines();
  $('party').innerHTML = MEMBERS.map(m => { const g = G.party[m] !== 'ok', h = G.hurt[m];
    return `<a class="${g ? 'fallen' : h ? 'hurt' : ''}">${nm(m)}${h && !g ? '<span class="hw">wounded</span>' : ''}${G.party[m] === 'fallen' ? '<span class="hw">fell at Midwinter</span>' : ''}${G.loyal[m] != null && !g ? `<span class="pips">${'♥'.repeat(G.loyal[m])}<i>${'♥'.repeat(5 - G.loyal[m])}</i></span>` : ''}</a>`; }).join('');
  $('fac').innerHTML = Object.keys(G.fac).map(k => { const f = G.fac[k];
    return f.here ? `<span>${S(k).short} <span class="h">${'♥'.repeat(f.h)}</span></span>` : `<span class="away">${k === 'guild' ? 'Guild: not yet' : k === 'fen' ? 'Fen-folk: not yet' : S(k).short + ': gone'}</span>`; }).join('');
}
function questLines() {
  const L = [];
  const Q = {wreck: ['The Frozen Wreck', 'salvage the barge, west'], masons: ['Masons for Hire', 'Oakwell: 4 Coin and a Guild letter'],
    plans: ['Thornmere\'s Plans', 'carry them home'], eel: ['The Eel-King\'s Price', 'clear the Barrow under the Ice'],
    monks: ['The Monks\' Escort', 'two monks to bring home'], hermit: ['The Last Hermit\'s Tale', 'the saint\'s lamp, from the Frozen Shrine']};
  for (const k in Q) if (G.q[k] === 'open' || G.q[k] === 'carrying') L.push(`<div class="q"><b>${Q[k][0]}</b> · ${Q[k][1]}</div>`);
  if (G.intel.length) L.push(`<div class="q">The Host: ${G.intel.map(t => S2.threats[t].name).join('; ')}</div>`);
  return L.slice(0, 4).join('');
}
async function choose(c) {
  if (G.busy) return;
  const lock = c.off || (c.who && !has(c.who)) || !can(c.c); if (lock) return;
  A.sfx('click'); if (window.BOT) G.log.push(`D${G.day} ${G.scene}: ${c.t} | B${G.res.Bread} T${G.res.Timber} S${G.res.Stone} C${G.res.Coin} W${G.res.Ward} P${G.people} M${G.militia} | built ${builtN()}`);
  busy(true); try { await c.go(); } catch (e) { console.error(e); if (window.BOT) G.log.push('ERROR ' + e.message); } busy(false); render();
}
const msg = (title, body, notes, next, label = 'Continue', kind = '') => show({kind, title, body: body + (notes && notes.length ? `<div class="cap" style="margin-top:10px;color:#ffd890">${notes.join(' · ')}</div>` : ''), ch: [{t: label, id: 'continue', go: next}]});

/* ------------------------------------------------------------------ the timing strike (as in Season 1) */
function strike(m, stat, label) {
  if (window.BOT) { const r = Math.random() + (CO[m].stats[stat] - 3) * .08; return Promise.resolve(r > .75 ? 'great' : r > .3 ? 'good' : 'miss'); }
  const v = CO[m].stats[stat] || 2, el = $('strike'), zw = 10 + v * 6, zc = 30 + Math.random() * 40;
  el.innerHTML = `<div class="lbl">${nm(m)}: ${label} <span style="color:#cbbd9f">· ${stat} ${'■'.repeat(v)}</span></div><div class="bar"><div class="zone" style="left:${zc - zw / 2}%;width:${zw}%"></div><div class="mk"></div></div><div class="res"></div><div class="hint">click, or press Space, when the marker is in the gold</div>`;
  el.style.display = 'block'; const mk = el.querySelector('.mk'), res = el.querySelector('.res'); const t0 = performance.now(); let done = false; A.sfx('page');
  return new Promise(resolve => {
    (function frame() { if (done) return; const ph = ((performance.now() - t0) / 900) % 2, pos = (ph < 1 ? ph : 2 - ph) * 100; mk.style.left = pos + '%'; mk.dataset.pos = pos; requestAnimationFrame(frame); })();
    G.striking = () => { if (done) return; done = true; G.striking = null; const d = Math.abs(+mk.dataset.pos - zc), q = d < zw * .18 ? 'great' : d < zw / 2 ? 'good' : 'miss';
      res.textContent = {great: 'Perfect!', good: 'Good.', miss: 'Missed…'}[q]; res.style.color = {great: '#fff0a0', good: '#ffd27a', miss: '#ff8a70'}[q];
      A.sfx(q === 'miss' ? 'loss' : q === 'great' ? 'ward' : 'click'); setTimeout(() => { el.style.display = 'none'; resolve(q); }, 650); };
    el.onclick = () => G.striking && G.striking();
  });
}
cv.addEventListener('mousedown', () => G.striking && G.striking());
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); if (G.striking) G.striking(); else $('stage').classList.add('peek'); } if (e.key === 'm' || e.key === 'M') A.toggle(); });
addEventListener('keyup', e => { if (e.code === 'Space') $('stage').classList.remove('peek'); });

/* ------------------------------------------------------------------ the day: council, home, the roads */
async function morning() {
  if (G.day >= S2.siegeDay) return nightOne();
  G.builtToday = false; G.usedToday = {};
  await goScene('council', 'home', ['fire', 'murmur']);
  const pool = S2.council.filter(m => (m.by === 'any' || (G.fac[m.by] && G.fac[m.by].here)) && !G.once['c_' + m.title]);
  const m = pool.length ? pick(pool) : null;
  if (!m) return home();
  G.once['c_' + m.title] = 1;
  const by = m.by === 'any' ? pick(facHere()) : m.by, sp = S(by);
  show({kind: `MORNING COUNCIL · DAY ${G.day}`, title: m.title, body: m.body, barks: [[sp.short, `"${m.title === 'A Loan' ? 'Think on it, Warden.' : 'Well, Warden?'}"`]],
    cap: 'The speakers wait.', ch: m.ch.map(c => ({...c, id: 'council', fxv: c.fx, go: async () => {
      if (c.who && c.who === 'm_tracker') { const q = await strike('m_tracker', 'Stealth', 'Run them down'); if (q === 'miss') { const n = fx({res: {Timber: -1}}); return msg('They get away', 'Ness loses them in the dark of the woods.', n, home); } }
      const n = fx(c.fx); const others = facHere().filter(k => k !== by);
      const react = others.map(k => { const d = (c.fx.fac || {})[k] || 0; return [S(k).short, d > 0 ? 'nods.' : d < 0 ? 'says nothing, and leaves early.' : 'shrugs.']; });
      show({kind: `MORNING COUNCIL · DAY ${G.day}`, title: m.title, body: 'It is decided.', barks: react, cap: n.join(' · '), ch: [{t: 'Out into the city', id: 'continue', go: home}]});
    }}))});
}

async function home() {
  await goScene('works', 'home', ['fire', 'wind']);
  const n = [];
  if (G.day === 2 && !G.q.wreck) { G.q.wreck = 'open'; G.flags.wreck = 1; return msg('A Bargeman at the Gate', 'A bargeman stands at the Gate, white with frost. His barge froze in the river west of here, cargo and all, and the ice is crushing her. "Timber, Warden. Good dry beams. Help me get it off and my lads are yours."', ['New quest: The Frozen Wreck'], home); }
  if (G.carry.plans) { G.carry.plans = 0; G.q.plans = 'done'; fx({unlock: ['yard'], flag: {plansHome: 1}}, n); n.push('the Gatehouse needs 1 less Stone'); }
  if (G.carry.monks) { G.carry.monks = 0; G.q.monks = 'done'; fx({unlock: ['chapel'], people: 2}, n); heart('faithful', 1, n); }
  if (G.carry.eelDone && !G.fac.fen.here) { G.carry.eelDone = 0; arrive('fen', n); }
  if (n.length) return msg('Home Again', 'The city has news for you.', n, home);
  const builds = Object.keys(S2.districts).filter(d => G.unlocked[d] && !G.built[d]);
  const ch = [];
  const unbuilt = Object.keys(S2.districts).filter(d => !G.built[d]);

/* ------------------------------------------------------------------ nights */
async function nightfall(days, text) {
  const notes = [];
  for (let i = 0; i < days; i++) passDay(notes, i === days - 1 && days === 1 && G.scene === 'works');
  if (G.view && G.view.title && text === null && G.trip) {
    const P = S2.places[G.trip.p]; text = `The Company comes home from ${P.title} after ${days === 1 ? 'a day' : days + ' days'} on the road.`; G.trip = null;
  }
  await goScene('works', 'home', ['fire', 'wind']);
  msg('Nightfall', text || '', notes, morning, 'Sleep');
}
function passDay(notes, rested) {
  const W = S2.work[G.work].res; for (const k in W) G.res[k] += W[k];   // the day's work comes in before supper
  if (G.built.square) G.res.Coin += 1;
  if (G.built.stores) G.res.Bread += 2;
  const n = need();
  if (G.res.Bread >= n) G.res.Bread -= n;
  else { G.res.Bread = 0; G.people = Math.max(0, G.people - 2); notes.push('Not enough bread: 2 people leave for the south'); const fs = facHere(); if (fs.length) heart(pick(fs), -1, notes); }
  if (G.built.yard && G.militia < Math.floor(G.people / 3)) G.militia += 1;
  if (G.built.gate && G.day % 2 === 0) { G.people += 1; notes.push('newcomers at the Gate (+1)'); }
  if (G.built.chapel || rested) G.hurt = {};
  if (G.day % 3 === 0) {
    if (G.res.Timber >= 1) { G.res.Timber -= 1; notes.push('the city burns 1 Timber against the cold'); }
    else { G.people = Math.max(0, G.people - 1); notes.push('no firewood: the cold takes someone'); heart('faithful', -1, notes); }
  }
  G.day += 1;
}

/* ------------------------------------------------------------------ the Midwinter siege */

  await goScene('siege_warning', 'tension', ['gale', 'fire']); A.sfx('rumble');
  const known = G.intel.map(t => S2.threats[t]);

async function nightTwo() {

async function assault() {

    if (s >= th) lines.push(`${P.name[0].toUpperCase() + P.name.slice(1)} holds.`);
    else { breaks++; lines.push(`The line breaks at ${P.name}.`);
      const there = G.posts[k] || []; if (there.length) { const m = there[0]; if (th - s >= 2 && m !== 'm_banner') { G.party[m] = 'fallen'; fallen.push(m); lines.push(`${nm(m)} falls there.`); } else { G.hurt[m] = 1; lines.push(`${nm(m)} is wounded.`); } } }

    [`${breaks} ${breaks === 1 ? 'break' : 'breaks'} in the line`], nightThree, 'Through the night', 'MIDWINTER · NIGHT TWO');
}
async function nightThree() {

async function finish() {

  if (G.res.Bread >= eat) G.res.Bread -= eat; else { dark++; G.people = Math.max(0, G.people - 4); notes.push('Hunger: 4 people die in the long dark'); }
  if (G.res.Timber >= warm) G.res.Timber -= warm; else { dark++; G.people = Math.max(0, G.people - 3); notes.push('Cold: 3 people die in the long dark'); }
  const city = builtN() >= 3, held = G.breaks <= 1, fell = G.breaks >= 3;
  const win = city && held && dark === 0, partial = !win && city && !fell && (G.breaks <= 2) && dark <= 1;
  const result = {win: win || partial, partial, districts: builtN(), breaks: G.breaks, dark, people: G.people, fallen: G.fallen, endDay: S2.maxDay};
  saveChronicle(result);
  if (window.BOT) G.log.push(`RESULT win=${win ? 1 : 0} partial=${partial ? 1 : 0} districts=${builtN()} breaks=${G.breaks} dark=${dark} people=${G.people} militia=${G.militia} intel=${G.intel.length} fallen=${(G.fallen || []).length} built=${Object.keys(G.built).filter(k => G.built[k]).join(',')}`);
  await goScene(win || partial ? 'siege_warning' : 'siege_long_dark', win || partial ? 'home' : 'eerie');
  const head = win ? 'Ravenwick Is a City' : partial ? 'Ravenwick Holds' : fell ? 'Ravenwick Falls' : !city ? 'Still a Holdfast' : 'The Long Night Wins';
  const body = win ? 'Dawn comes up red over the Spires, and the Host is gone from the valley. Ravenwick has walls, districts and a council, and it held. The spring will come to a City.'
    : partial ? 'It held, at a cost. The Host draws off at dawn, and Ravenwick is a City, scarred, but standing.'
    : fell ? 'The line broke in too many places. By dawn the Host is inside the walls.'
    : !city ? 'The walls held, but Ravenwick never became more than a holdfast. In spring the people drift south to Oakwell and Hollin.'
    : 'The cold and the hunger did what the Host could not.';
  show({kind: 'THE END OF SEASON 2', title: head, body, cap: notes.join(' · ') + (win || partial ? ' · Your Season 2 chronicle is saved.' : ''),
    ch: [{t: 'Play the season again', id: 'again', go: () => location.reload()}]});

}
