<style>

    background:linear-gradient(90deg,rgba(7,6,10,0) 0%,rgba(7,6,10,.8) 16%,rgba(7,6,10,.9) 100%);transition:opacity .45s,transform .55s cubic-bezier(.4,0,.2,1)}

<div id="stage">
  <canvas id="c" width="427" height="240"></canvas>
  <div id="topshade"></div>
  <div id="fade"></div>
  <div id="top" class="hud"><div id="res"></div><div id="goal"></div></div>

<script src="layers.js?v=1795483643"></script>
<script src="audio.js?v=1795483643"></script>
<script src="i18n.js?v=1795483643"></script>
<script src="i18n_ru.js?v=1795483643"></script>
<script src="i18n_es.js?v=1795483643"></script>

<script>
/* =================================================================== engine */
const A=window.Audio2;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
const IMG={};for(const k in LAYERS){const seen={};IMG[k]=LAYERS[k].map(l=>{const i=new Image();i.src=l.src;const n=seen[l.name]=(seen[l.name]||0)+1;return {...l,id:n>1?l.name+'#'+n:l.name,img:i}})}
const Z=1.04,CW=427,CH=240,SY=60;   // canvas size; the painted scene starts 60px down, under added sky
const MEMBERS=['m_banner','m_cleric','m_captain','m_tracker'];
let O={};
const st=id=>O[id]||(O[id]={dx:0,dy:0,a:1,sc:1,lit:0,walk:0,lean:0});
const box=n=>(IMG[G.scene]||[]).find(l=>l.name===n);
const all=n=>(IMG[G.scene]||[]).filter(l=>l.name===n);
window.SPEED=1;const sleep=ms=>new Promise(r=>setTimeout(r,ms/SPEED));
const ease=t=>-(Math.cos(Math.PI*t)-1)/2;
const TW=[];
function tw(id,to,ms=600,e=ease){const s=st(id),from={};for(const k in to)from[k]=s[k];return new Promise(res=>TW.push({s,from,to,t0:performance.now(),ms:ms/SPEED,e,res}))}
const twAll=(n,to,ms,stagger=0)=>Promise.all(all(n).map((l,i)=>sleep(i*stagger).then(()=>tw(l.id,to,ms))));
const FX=[];
function ring(x,y,col,ms=1400,R=140){FX.push({k:'ring',x,y,col,t0:performance.now(),ms,R})}
function flash(ms=220,col='255,240,220'){FX.push({k:'flash',col,t0:performance.now(),ms})}
let shakeUntil=0,shakeAmp=0;function shake(ms=400,a=2){shakeUntil=performance.now()+ms;shakeAmp=a}
const P=[];function spark(x,y,n,col,spd=1,up=0,g=.02){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=(Math.random()*.8+.2)*spd;P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-up,l:1,col,g})}}
const SNOW=[],RAIN=[];
const feet=m=>{const b=box(m),s=st(m);return [b.x+b.w/2+s.dx,b.y+b.h+s.dy]};
const head=m=>{const b=box(m),s=st(m);return [b.x+6+s.dx,b.y+12+s.dy]};
function lantern(){const b=box('m_cleric'),s=st('m_cleric');return [b.x+b.w-8+s.dx,b.y+11+s.dy]}
const here=m=>G.party[m]!=='gone'&&!!box(m);
const hov=n=>Array.isArray(G.hover)?G.hover.includes(n):G.hover===n;
const fading=id=>st(id).a>0.01&&st(id).a<1;

function visible(l){
  const n=l.name;
  if(n==='vignette')return false;
  if(n==='walls'||n==='tower')return !!G.built[n];
  if(['thieves','fire','refugees'].includes(n))return !G.endFX&&(G.trouble===n||fading(l.id)||(n==='refugees'&&G.refugeesIn&&!G.built.walls));  // once walls stand, the family lives inside them
  if(/^r\d$/.test(n))return !G.flags.ridersGone||fading(l.id);
  if(G.scene==='shrine'&&(n==='light'||n==='candles'))return !G.flags.shrineDark||fading(l.id);
  if(MEMBERS.includes(n))return G.party[n]!=='gone'||fading(l.id);
  return true;
}
let lastStep=0;
function draw(t){
  const L=IMG[G.scene];if(!L)return;
  for(let i=TW.length-1;i>=0;i--){const w=TW[i];const p=Math.min(1,(t-w.t0)/w.ms),k=w.e(p);for(const key in w.to)w.s[key]=w.from[key]+(w.to[key]-w.from[key])*k;if(p>=1){TW.splice(i,1);w.res()}}
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,CW,CH);
  let sx=0,sy=0;if(t<shakeUntil){sx=(Math.random()-.5)*shakeAmp*2;sy=(Math.random()-.5)*shakeAmp*2}
  ctx.setTransform(Z,0,0,Z,-CW/2*(Z-1)+sx,-CH/2*(Z-1)+sy+SY*Z);
  skyAbove(L,t);
  const sway=Math.sin(t*.00016)*3,bob=Math.sin(t*.00035);
  const pulse=.5+.5*Math.sin(t*.006);
  const DEP={sky:0,stars:.05,disc:.1,clouds:.25,ridge:.45,dest_north:.45,dest_east:.45,bank:1.3,frame_trees:1.6};
  let walking=false,firstRidge=true;
  for(const l of L){
    if(l.name==='ridge'&&firstRidge){firstRidge=false;if(G.endFX)endDraw(t,'behind')}
    if(!visible(l))continue;
    const s=st(l.id);if(s.a<=0)continue;
    const d=DEP[l.name]??(l.name.startsWith('m_')?1.4:.85);
    let x=l.x+sway*d+s.dx,y=l.y+bob*d*.5+s.dy,a=s.a;
    if(l.name==='clouds')x+=Math.sin(t*.00007)*10;
    if(l.name==='stars'||l.name==='fireflies')a*=.6+.4*Math.sin(t*.003+l.x);
    if(l.name==='light'||l.name==='rays')a*=.8+.2*Math.sin(t*.002);
    if(['candles','camp','glow'].includes(l.name))a*=.82+.18*Math.sin(t*.013)*Math.sin(t*.007+l.x);
    if(l.name==='fire'){a*=.75+.25*Math.random();if(Math.random()<.5)spark(l.x+10+Math.random()*14,l.y+12,1,'255,170,70',.3,.5,-.005)}
    if(l.name==='fog')x+=Math.sin(t*.00012+l.y)*8;
    if(l.name==='thieves')x+=Math.round(Math.sin(t*.0011)*1.5);
    if(l.name==='person'&&G.scene==='pilgrims')x+=((t*.0012)%40)-20;
    if(s.walk){y-=Math.round(Math.max(0,Math.sin(t*.012+l.x))*1.4);walking=true}
    ctx.globalAlpha=Math.max(0,Math.min(1,a));
    let dx_=Math.round(x),dy_=Math.round(y),dw=l.w,dh=l.h;
    if(s.sc!==1){dw=Math.max(1,Math.round(l.w*s.sc));dh=Math.max(1,Math.round(l.h*s.sc));dx_=Math.round(x+(l.w-dw)/2);dy_=Math.round(y+l.h-dh)}
    const lean=s.lean+(G.hurt[l.name]?.12:0);
    const rv=G.reveal[l.name];
    if(rv&&t-rv<1600){const p=(t-rv)/1600,hh=Math.max(1,Math.ceil(l.h*ease(p)));ctx.drawImage(l.img,0,l.h-hh,l.w,hh,dx_,dy_+l.h-hh,l.w,hh);
      if(Math.random()<.7)spark(l.x+Math.random()*l.w,l.y+l.h-hh,1,'210,200,180',.4,.4);}
    else if(lean){ctx.save();ctx.translate(dx_+dw/2,dy_+dh);ctx.rotate(lean);ctx.drawImage(l.img,-dw/2,-dh,dw,dh);ctx.restore()}
    else ctx.drawImage(l.img,dx_,dy_,dw,dh);
    const lit=s.lit+(hov(l.name)?.45*pulse:0)+(G.hot===l.name?.4*pulse:0);
    if(lit>0){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=Math.min(1,lit)*a;ctx.drawImage(l.img,dx_,dy_,dw,dh);ctx.globalCompositeOperation='source-over'}
    ctx.globalAlpha=1;
    if(l.name==='bank')embers();
  }
  if(walking&&t-lastStep>260){lastStep=t;A.sfx('step')}
  if(FIREFLIES[G.scene]&&!G.endFX)fireflies(t);
  if(G.search)searchDraw(t);
  if(window.PFX&&PFX.ready){const off=PFX.render(SPEED);if(off){ctx.save();ctx.setTransform(Z,0,0,Z,-CW/2*(Z-1),-CH/2*(Z-1));ctx.drawImage(off,0,0);ctx.restore()}}
  if(G.endFX)endDraw(t,'front');
  const v=L.find(l=>l.name==='vignette');if(v)ctx.drawImage(v.img,v.x,v.y);
  for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.l-=.012;ctx.fillStyle=`rgba(${p.col},${Math.max(0,p.l)})`;ctx.fillRect(Math.round(p.x),Math.round(p.y),1,1)}
  for(let i=P.length-1;i>=0;i--)if(P[i].l<=0)P.splice(i,1);
  if(G.raining){if(RAIN.length<200)RAIN.push({x:Math.random()*460,y:-70});ctx.strokeStyle='rgba(170,190,220,.55)';ctx.beginPath();for(const r of RAIN){r.y+=4;r.x-=1;if(r.y>185){r.y=-70;r.x=Math.random()*460}ctx.moveTo(r.x,r.y);ctx.lineTo(r.x-1,r.y+4)}ctx.stroke()}
  else RAIN.length=0;
  if(G.day>=G.maxDay-1||G.over){if(SNOW.length<(G.over?280:50))SNOW.push({x:Math.random()*450-10,y:-64,v:.15+Math.random()*.3,ph:Math.random()*6});
    ctx.fillStyle='rgba(240,240,255,.85)';for(const f of SNOW){f.y+=f.v;f.x+=Math.sin(t*.001+f.ph)*.15;if(f.y>182){f.y=-64;f.x=Math.random()*450-10}ctx.fillRect(Math.round(f.x),Math.round(f.y),1,1)}}
  ctx.setTransform(1,0,0,1,0,SY);

// A marker sweeps a bar; strike inside the gold. The character's stat sets how wide the gold is.
function strike(m,stat,label){
  if(window.BOT)return Promise.resolve('good');
  if(window.FORCE_Q)setTimeout(()=>{if(G.striking){const q=window.FORCE_Q;G.striking=null;document.getElementById('strike').style.display='none';G._forced(q)}},120);
  const v=CO[m].stats[stat]||2,el=document.getElementById('strike');
  const zw=10+v*6,zc=30+Math.random()*40;
  el.innerHTML=`<div class="lbl">${label} <span style="color:#cbbd9f">· ${stat} ${'■'.repeat(v)}</span></div><div class="bar"><div class="zone" style="left:${zc-zw/2}%;width:${zw}%"></div><div class="mk"></div></div><div class="res"></div><div class="hint">click, or press Space, when the marker is in the gold</div>`;
  el.style.display='block';const mk=el.querySelector('.mk'),res=el.querySelector('.res');
  const t0=performance.now(),per=900/Math.max(.5,SPEED);let done=false;A.sfx('page');
  return new Promise(resolve=>{G._forced=resolve;
    function frame(){if(done)return;const ph=((performance.now()-t0)/per)%2,pos=(ph<1?ph:2-ph)*100;mk.style.left=pos+'%';mk.dataset.pos=pos;requestAnimationFrame(frame)}
    frame();
    G.striking=()=>{if(done)return;done=true;G.striking=null;const pos=+mk.dataset.pos,d=Math.abs(pos-zc);
      const q=d<zw*.18?'great':d<zw/2?'good':'miss';
      res.textContent={great:'Perfect!',good:'Good.',miss:'Missed…'}[q];res.style.color={great:'#fff0a0',good:'#ffd27a',miss:'#ff8a70'}[q];
      _sfx(q==='miss'?'loss':q==='great'?'ward':'click');if(q==='great')fxOn(m,'holy/sunburst',{life:1.2});
      setTimeout(()=>{el.style.display='none';resolve(q)},650)};
    el.onclick=()=>G.striking&&G.striking();
  });
}

      r:r<.35?{Coin:1}:r<.62?{Bread:2}:r<.85?{Stone:1}:{Ward:1}})}

    el.style.display='block';document.getElementById('stopsearch').onclick=e=>{e.stopPropagation();endSearch()}};

  {t:'Pay the toll',who:'m_banner',s:`Lose ${Y.toll} Coin · they let you through to Oakwell`,c:{Coin:Y.toll},go:()=>beat(async()=>{pay({Coin:Y.toll});
     await goTo('m_banner',box('m_banner').x+16,box('m_banner').y+box('m_banner').h-8,1,700);const [x,y]=head('m_banner');for(let i=0;i<4;i++){spark(x,y,6,'255,214,110',.6,.8);await sleep(120)}A.sfx('coin');
     await Promise.all([tw('r0',{dx:-50},1000),tw('r1',{dx:-30},1000),tw('r2',{dx:30},1000),tw('r3',{dx:50},1000)]);
     await walkOut([[0,-34,.65,0,1500]]);G.flags.ridersGone=true;gain({Coin:Y.market+1});
     await sleep(300);for(const m of MEMBERS)Object.assign(st(m),{dx:0,dy:0,sc:1,a:0,walk:0});await Promise.all(MEMBERS.map(m=>tw(m,{a:1},500)));
     loyal('m_captain',-1,'"We paid them. We paid them." Brannoc won\'t look at you.');
     outcome('THROUGH',`They part like a curtain, laughing. Oakwell market is two hours on. You sell what you can. +${Y.market+1} Coin.`)})},
  {t:'Draw steel',who:actorFor('steel'),s:'Their purses are heavy'+(carries(actorFor('steel')||'x','steel')?' · the fen-iron sword keeps the bearer whole':' · whoever fights may be wounded'),go:()=>beat(async()=>{const a=actorFor('steel');
     const q=await strike(a,'Might',`${CO[a].short} charges the riders`);st(a).walk=1;await tw(a,{dx:18,dy:-30,sc:.85},500);A.sfx('clash');flash(140);shake(q==='great'?800:500,q==='great'?4:3);const r=box('r1');spark(r.x+8,r.y+8,40,'255,240,200',1.6);
     A.sfx('gallop');await Promise.all(['r0','r1','r2','r3'].map((r,i)=>tw(r,{dx:[-150,-110,120,160][i],dy:-4,a:0},900)));G.flags.ridersGone=true;
     await tw(a,{dx:6,dy:-6,sc:1},500);st(a).walk=0;
     const safe=q==='great'||(q==='good'&&((a==='m_captain'&&G.loyal.m_captain>=5)||carries(a,'steel')));const take=Y.steel+(q==='great'?1:0)-(q==='miss'?1:0);gain({Coin:take});(G.gear[a]=G.gear[a]||[]).push('A highwayman\'s saddlebag');
     if(!safe){A.sfx('hurt');G.hurt[a]=q==='miss'?3:2}await tw(a,{dy:0,dx:0},400);
     if(a==='m_captain')loyal('m_captain',1,safe?'"Not a scratch."':'"Worth it." He is bleeding, and grinning.');
     outcome('STEEL IN THE DUSK',(q==='great'?'A perfect charge. ':q==='miss'?'A clumsy, bloody fight. ':'')+`They break and scatter and leave a saddlebag behind. +${take} Coin.`+(safe?'':` ${CO[a].short} took a blade in the arm: wounded for ${G.hurt[a]} days.`))})}]}),

shrine:()=>({kind:'DISCOVERY',title:'The Spire Shrine',body:'Green light pools around a statue no one remembers. Its altar is cut from good grey stone.',cap:'Greyspires · night · Aldous has gone very quiet',ch:[
  {t:'Kneel and pray',who:'m_cleric',s:'+1 Ward',go:()=>beat(async()=>{await goTo('m_cleric',165,153,.85,1500);
     await tw('m_cleric',{dy:st('m_cleric').dy+3},300);A.sfx('prayer');ring(160,110,'170,255,190',2000,120);await tw('light',{lit:.8},800);
     const [x,y]=head('m_cleric');spark(x,y,30,'190,255,200',.6,.6);await tw('light',{lit:0},900);gain({Ward:1});await back('m_cleric',1300);
     loyal('m_cleric',1,'"It remembers us. It remembers everyone."');
     outcome('IT LISTENS','For a moment the statue seems to lean toward you. +1 Ward.')})},
  {t:'Haul the fallen stones',who:'m_captain',s:`+${Y.shrineHaul+(hasItem('mule')?1:0)} Stone · a slow, honest load`,go:()=>haul(Y.shrineHaul,165,150)},
  {t:'Pry loose the altar',s:'+6 Stone · the light will go out',go:()=>beat(async()=>{
     const crew=['m_captain','m_tracker','m_banner'].filter(here).slice(0,2);
     await Promise.all(crew.map((m,i)=>goTo(m,152+i*14,152,.85,1400)));
     for(let i=0;i<5;i++){shake(160,1.5);A.sfx('stone');spark(160,140,8,'160,170,160',1);await sleep(300)}
     A.sfx('rumble');await Promise.all([tw('light',{a:0},1400),tw('candles',{a:0},900)]);G.flags.shrineDark=true;gain({Stone:6});
     await Promise.all(crew.map(m=>back(m,1300)));
     loyal('m_cleric',-3,'Aldous says nothing at all.');loyal('m_tracker',1,'"Good stone is good stone."');
     outcome('THE LIGHT GOES OUT','The altar comes apart in good square blocks. +6 Stone.')})}]}),

lost_in_mists:()=>({kind:'ENCOUNTER · THE HIGH PASS',title:'The Grey Mist',body:'Mist pours down the pass until you can\'t see your own hands. Somewhere ahead, water; somewhere behind, the drop.',cap:'Greyspires · noon, though you\'d never know it',ch:[
  ...(hasItem('jar')?[{t:'Follow the marsh-light',who:holder('jar'),s:`The jar glows brighter near the old road · +${Y.mists} Stone`,go:()=>beat(async()=>{for(const m of ALL4())tw(m,{dx:40,a:.5},1500);await sleep(1600);A.sfx('ward');
     await twAll('fog',{a:.3},1000);gain({Stone:Y.mists});for(const m of ALL4())tw(m,{dx:0,a:1},1200);await twAll('fog',{a:1},1200);outcome('THE OLD ROAD','The light in the jar leads you along a buried road to a waymarker cairn. +'+Y.mists+' Stone.')})}]:[]),
  {t:'Follow Ness',who:'m_tracker',s:`Pathfind · Ness knows these heights · +${Y.mists} Stone`,go:()=>beat(async()=>{
     await goTo('m_tracker',230,176,1,900);await tw('m_tracker',{a:.25},800);for(const m of ALL4().filter(x=>x!=='m_tracker'))tw(m,{dx:30,a:.4},1400);await sleep(1500);
     await twAll('fog',{a:.3},1200);A.sfx('stone');shake(300,.8);gain({Stone:Y.mists});
     for(const m of ALL4())tw(m,{dx:0,dy:0,a:1},1200);await twAll('fog',{a:1},1200);
     loyal('m_tracker',1,'"Told you. Mist is only weather."');
     outcome('A CAIRN IN THE MIST',`Ness leads you to an old waymarker cairn of cut blocks, forgotten up here for a century. +${Y.mists} Stone.`)})},
  {t:'Push on blind',s:'Maybe stone, maybe a fall',go:()=>beat(async()=>{
     for(const m of ALL4())tw(m,{dx:40,a:.4},1600);await sleep(1700);
     const q=await strike('m_banner','Wits','You feel for the path');
     if(q!=='miss'&&(q==='great'||Math.random()<Y.mistsLuck+.25)){gain({Stone:q==='great'?3:2});for(const m of ALL4())tw(m,{dx:0,a:1},1000);await sleep(1100);outcome('LUCK',`You stumble on a ruined wall and take what you can carry. +${q==='great'?3:2} Stone.`)}
     else{const v=ALL4().filter(m=>m!=='m_banner');const m=v[Math.floor(Math.random()*v.length)]||'m_banner';A.sfx('hurt');shake(400,2);G.hurt[m]=2;
       for(const x of ALL4())tw(x,{dx:0,a:1},1000);await sleep(1100);loyal('m_tracker',-1,'"I could have led us." Ness is furious.');
       outcome('A FALL',`${CO[m].name} slips on wet shale and goes down hard. Wounded for 2 days. You come down with nothing.`)}})},
  {t:'Wait for it to lift',s:'Lose a day · safe',go:()=>beat(async()=>{for(let i=0;i<=10;i++){G.dim=i/14;await sleep(70)}endOfDay('x','x');await sleep(500);for(let i=10;i>=0;i--){G.dim=i/14;await sleep(70)}
     outcome('A LOST DAY','The mist lifts at dawn on a bare, empty pass. A day gone.')})}]}),

hidden_cache:()=>({kind:'DISCOVERY',title:'The Sunlit Hollow',body:'Light falls through the trees onto a ring of low stones. Between them, half-buried, the corner of an iron-bound box.',cap:'Greyspires foothills · morning',ch:[
  {t:'Dig it up',who:'m_tracker',s:'Whatever is in it',go:()=>beat(async()=>{await goTo('m_tracker',170,152,.9,1200);for(let i=0;i<4;i++){spark(170,150,6,'140,110,70',.8,.6);A.sfx('step');await sleep(220)}
     A.sfx('coin');spark(170,146,30,'255,220,120',1,.8);gain({Coin:Y.hollow});getItem('signet');await back('m_tracker');
     loyal('m_tracker',1,'Ness bites a coin and grins.');loyal('m_cleric',-1,'"These were graves, Wren."');
     outcome('OLD SILVER',`Coins nobody has spent in a hundred years, and a signet ring with a crest the lowland riders might remember. +${Y.hollow} Coin, and the Signet.`)})},
  {t:'Leave the dead their silver',who:'m_cleric',s:'Aldous will say the words · +1 Ward',go:()=>beat(async()=>{await goTo('m_cleric',160,152,.9,1300);A.sfx('prayer');ring(165,140,'255,240,200',1800,90);await sleep(1600);await back('m_cleric');
     loyal('m_cleric',1,'"Rest. Rest now."');gain({Ward:1});learn('herbs');outcome('THE WORDS ARE SAID','The light in the hollow seems warmer as you leave. Between the stones, Aldous finds feverfew and woundwort, and knows them. +1 Ward.')})}]}),

hidden_pass:()=>({kind:'THE OLD QUARRY',title:'Under the Snowline',body:'Someone cut stone here long ago and left the blocks where they fell. Above, on the cliff, the best of it, glittering with ice.',cap:'Greyspires · always here when you need stone · one job per visit',ch:[
  {t:'Haul what lies below',who:'m_captain',s:`+${Y.quarry+(hasItem('mule')?1:0)} Stone`,go:()=>haul(Y.quarry,170,170)},
  {t:'Climb for the good stone',who:actorFor('climb'),s:`+${Y.climb+(carries(actorFor('climb')||'x','climb')?1:0)} Stone · `+(carries(actorFor('climb')||'x','climb')?'the irons will hold':'it\'s a long way down'),go:()=>beat(async()=>{const a=actorFor('climb'),ir=carries(a,'climb');await goTo(a,236,120,.6,1600);
     for(let i=0;i<3;i++){A.sfx('stone');spark(236,118,8,'200,200,210',1);await sleep(300)}
     const q=await strike(a,'Stealth',`${CO[a].short} reaches for the next hold`);
     const fall=q==='miss'?!ir:q==='good'&&!(a==='m_tracker'&&G.loyal.m_tracker>=5)&&!ir&&Math.random()<Y.climbFall/2,n=Y.climb+(ir?1:0)+(q==='great'?1:0);
     if(fall){A.sfx('hurt');shake(500,2.5);await tw(a,{dy:st(a).dy+30},300);G.hurt[a]=3;gain({Stone:2})}else gain({Stone:n});
     await back(a,1400);
     outcome(fall?'A FALL':'GOOD STONE',fall?`The ice gives way. ${CO[a].short} lands badly but holds onto two blocks. +2 Stone. ${CO[a].short} is wounded for 3 days.`:`${CO[a].short} lowers block after block on a rope. +${n} Stone.`)})}]}),

pilgrims:()=>({kind:'ENCOUNTER · THE LOWLANDS',title:'The Long Procession',body:'Pilgrims walk the ridge with lanterns, bound for a shrine in the north. They are thin, and they are singing.',cap:'the lowlands · dusk',ch:[
  {t:'Share your bread',who:'m_banner',s:'−2 Bread · they will remember Ravenwick',c:{Bread:2},go:()=>beat(async()=>{pay({Bread:2});await goTo('m_banner',150,160,.9,1200);spark(150,145,20,'255,220,150',.6,.6);A.sfx('gain');await back('m_banner');
     loyal('m_cleric',1,'"That was well done."');loyal('m_tracker',-1,'Ness watches the bread go with real pain.');gain({Ward:1});
     outcome('BLESSED','An old woman presses a charm into your hand: a little lead lantern. +1 Ward.')})},
  {t:'Walk with them a while',who:'m_cleric',s:'Aldous will pray with them',go:()=>beat(async()=>{await goTo('m_cleric',140,150,.8,1600);A.sfx('prayer');await sleep(1500);await back('m_cleric',1500);
     loyal('m_cleric',1,'Aldous comes back looking ten years younger.');getItem('satchel');outcome('A HYMN','Their song stays with you for the rest of the day. A herb-woman among them gives Aldous her old satchel.')})},
  {t:'Ask for alms for Ravenwick',who:'m_banner',s:`+${Y.alms} Coin · they are poor`,go:()=>beat(async()=>{await goTo('m_banner',150,160,.9,1200);A.sfx('coin');gain({Coin:Y.alms});await back('m_banner');
     loyal('m_cleric',-1,'"From pilgrims, Wren?"');outcome('ALMS',`They give, because they give to everyone. +${Y.alms} Coin.`)})}]}),

abandoned_wagon:()=>({kind:'ENCOUNTER · THE LOWLANDS',title:'An Overturned Wagon',body:'A grain wagon on its side in the ruts. No horse, no driver, no sign of a fight. The crows have already been at the sacks.',cap:'the east road · morning',ch:[
  {t:'Search it',who:'m_tracker',s:`+${Y.wagon} Bread, +1 Coin`,go:()=>beat(async()=>{await goTo('m_tracker',236,168,.95,1300);for(let i=0;i<3;i++){shake(120,.6);A.sfx('step');await sleep(250)}
     gain({Bread:Y.wagon,Coin:1});await back('m_tracker');outcome('SALVAGE',`Good sacks and a strongbox with one coin in it. +${Y.wagon} Bread, +1 Coin.`)})},
  {t:'Right it and drag it home',who:'m_captain',s:`+${Y.wagon} Bread, +1 Stone (the axle iron) · Brannoc strains`,go:()=>beat(async()=>{await goTo('m_captain',236,168,.95,1300);A.sfx('stone');shake(600,1.5);await sleep(500);
     gain({Bread:Y.wagon,Stone:1});loyal('m_captain',1,'"Good honest work."');await back('m_captain');outcome('HAULED',`You take the wagon too. +${Y.wagon} Bread, +1 Stone.`)})},
  {t:'Look for the driver',who:'m_cleric',s:'Someone may need help',go:()=>beat(async()=>{await goTo('m_cleric',260,160,.8,1600);await sleep(900);await back('m_cleric',1600);
     loyal('m_cleric',1,'"We found him. He\'s buried now."');loyal('m_tracker',-1,'"Wasted the morning."');gain({Bread:2});outcome('TOO LATE','The driver is in the ditch. Aldous buries him. You take the grain afterwards. +2 Bread.')})}]}),

friendly_hamlet:()=>({kind:'THE HAMLET OF HOLLIN',title:'Hollin Market',body:'Five cottages and a well, and a market every night the weather allows. They have heard of Ravenwick.',cap:'the lowlands · always open · one deal per visit',ch:[
  {t:'Sell grain',s:`2 Bread → ${Y.sell+(hasItem('signet')?1:0)+(knows('haggle')?1:0)} Coin`,c:{Bread:2},go:()=>beat(async()=>{pay({Bread:2});await goTo('m_banner',170,156,.9,1000);A.sfx('coin');gain({Coin:Y.sell+(hasItem('signet')?1:0)+(knows('haggle')?1:0)});await back('m_banner');outcome('','Coin for bread. Ravenwick needs its tower.')})},
  {t:'Buy grain',s:`1 Coin → ${3+(knows('haggle')?1:0)} Bread`,c:{Coin:1},go:()=>beat(async()=>{pay({Coin:1});await goTo('m_banner',170,156,.9,1000);A.sfx('gain');gain({Bread:3+(knows('haggle')?1:0)});await back('m_banner');outcome('','Sacks of Hollin barley.')})},
  ...(owned('mule')?[]:[{t:'Buy a pack mule',s:'3 Coin · every haul of stone brings +1',c:{Coin:3},go:()=>beat(async()=>{pay({Coin:3});getItem('mule');await sleep(600);outcome('A MULE','Her name is Turnip. She bites.')})}]),
  {t:'Stay the night',s:'Everyone rests and the wounded mend · a day passes',go:()=>beat(async()=>{for(let i=0;i<=10;i++){G.dim=i/14;await sleep(70)}endOfDay('x','x');for(const m in G.hurt)delete G.hurt[m];
     for(let i=10;i>=0;i--){G.dim=i/14;await sleep(70)}for(const m of ['m_cleric','m_captain'])loyal(m,1);learn('haggle');outcome('A WARM NIGHT','Ale, a fire, and real beds. The wounded are mended, and the innkeeper teaches you how Hollin really trades.')})}]}),

ferry:()=>({kind:'THE FENS',title:'The Old Ferry',body:`A raft on a rope across the river, and a ferryman with a lantern. He wants ${Y.ferry} Coin to take you over into the Fens. He lost a son to this water in the spring.`,cap:'the river · dusk',ch:[
  {t:'Pay the ferryman',s:`−${Y.ferry} Coin`,c:{Coin:Y.ferry},go:()=>beat(async()=>{pay({Coin:Y.ferry});A.sfx('coin');for(const m of ALL4())goTo(m,176+(MEMBERS.indexOf(m)-1.5)*8,131,.8,1400);await sleep(1500);
     await Promise.all([tw('ferry',{dx:40},2200),...ALL4().map(m=>tw(m,{dx:st(m).dx+40},2200))]);await Promise.all(ALL4().map(m=>back(m,1)));await tw('ferry',{dx:0},1);
     outcome('ACROSS','He poles you over without a word. The far bank smells of peat and old water.')})},
  {t:'Bless the water for his son',who:'m_cleric',s:'He\'ll take you for nothing',go:()=>beat(async()=>{await goTo('m_cleric',150,150,.9,1300);A.sfx('prayer');ring(176,128,'200,230,255',2200,110);await sleep(1800);await back('m_cleric');
     loyal('m_cleric',1,'"The river gives back, sometimes. Not often."');learn('fishing');outcome('A BLESSING','The ferryman weeps a little, and takes you across for nothing. You cross free from now on. While you wait, he shows Ness how the fen-folk set their lines.')})},
  {t:'Wade the ford upriver',who:'m_tracker',s:'Free · soaked stores, −1 Bread',go:()=>beat(async()=>{await goTo('m_tracker',120,170,1,1000);for(const m of ALL4())tw(m,{dy:st(m).dy+4,a:.7},1200);A.sfx('whoosh');await sleep(1400);
     gain({Bread:-1});for(const m of ALL4())tw(m,{dy:0,dx:0,a:1},1000);await sleep(1100);loyal('m_tracker',1,'"Ferrymen. Ha."');outcome('COLD WATER','Up to your chests and the current pulling. Everyone makes it. The bread doesn\'t.')})}]}),

fen_lights:()=>({kind:'ENCOUNTER · THE FENS',title:'Lights on the Water',body:'Pale lights drift over the black water between dead trees. Locals say they lead to the drowned, and to what the drowned were carrying.',cap:'the Fens · night',ch:[
  {t:'Mark a safe path',who:'m_tracker',s:`Ness tests every step · +${Y.purse} Coin`,go:()=>beat(async()=>{await goTo('m_tracker',176,150,.85,1600);await sleep(600);A.sfx('coin');spark(176,140,20,'255,220,120',.8,.6);gain({Coin:Y.purse});await back('m_tracker',1400);
     loyal('m_tracker',1);outcome('A DROWNED PURSE',`Under the lights, a skeleton in the reeds with his purse still tied on. +${Y.purse} Coin.`)})},
  {t:'Catch one in a jar',who:'m_cleric',s:'A light that finds safe ways',go:()=>beat(async()=>{await goTo('m_cleric',150,150,.9,1400);A.sfx('prayer');await twAll('wisps',{dx:-20,dy:20},1600);ring(150,135,'190,255,200',1600,60);
     getItem('jar');await twAll('wisps',{dx:0,dy:0,a:.6},1200);await back('m_cleric');loyal('m_cleric',1,'"It is only lost. Like the rest of us."');loyal('m_tracker',-1,'"Leave them be, old man."');
     outcome('A MARSH-LIGHT','One light comes to Aldous\'s hand like a moth, and settles in his lantern-jar. You have the Marsh-light.')})},
  {t:'Follow the lights',s:'Something, or someone, is out there',go:()=>beat(async()=>{for(const m of ALL4())tw(m,{dx:60,a:.4},1800);await twAll('wisps',{dx:40},1800);
     if(Math.random()<Y.wispLuck){A.sfx('ward');gain({Ward:2});for(const m of ALL4())tw(m,{dx:0,a:1},1200);await twAll('wisps',{dx:0},1200);outcome('A RELIC','The lights circle a reliquary in the reeds: a saint\'s fingerbone in silver. +2 Ward.')}
     else{const v=ALL4().filter(m=>m!=='m_banner');const m=v[Math.floor(Math.random()*v.length)]||'m_banner';A.sfx('hurt');G.hurt[m]=2;for(const x of ALL4())tw(x,{dx:0,a:1},1200);await twAll('wisps',{dx:0},1200);
       outcome('THE DEEP WATER',`The ground gives way under ${CO[m].name}. You haul them out, half-drowned. Wounded for 2 days.`)}})}]}),

drowned_chapel:()=>({kind:'DISCOVERY · THE FENS',title:'The Drowned Chapel',body:'A chapel half under the lake, its bell still hanging in the tower. In the crypt, they say, a fen-knight was buried with his sword.',cap:'the Fens · moonlight',ch:[
  {t:'Dive for the bell',who:'m_captain',s:'The Saint\'s Bell: +1 Ward each time you rest at home',go:()=>beat(async()=>{await goTo('m_captain',172,156,.85,1400);const q=await strike('m_captain','Might','Brannoc holds his breath');A.sfx('whoosh');spark(172,150,26,'200,215,235',.9,.9);await tw('m_captain',{a:.2},600);await sleep(800);
     A.sfx('ward');await tw('bell',{a:0},900);getItem('bell');await tw('m_captain',{a:1},600);if(q==='miss'){A.sfx('hurt');G.hurt.m_captain=2}await back('m_captain');loyal('m_captain',1,'"Heavier than it looks."');loyal('m_cleric',1);
     outcome('THE SAINT\'S BELL','Brannoc comes up blue with cold and the bell on his shoulder. It will hang in Ravenwick.'+(q==='miss'?' He swallowed half the lake: wounded for 2 days.':''))})},
  {t:'Search the crypt',who:'m_tracker',s:'The fen-knight\'s sword: Brannoc is never wounded',go:()=>beat(async()=>{await goTo('m_tracker',140,156,.85,1400);await tw('m_tracker',{a:.15},700);await sleep(900);A.sfx('clash');await tw('m_tracker',{a:1},600);await back('m_tracker');
     getItem('sword');loyal('m_cleric',-1,'"We do not rob the dead."');outcome('FEN-IRON','A long blade, black and unrusted after a hundred years under water. Ness hands it to Brannoc without a word.')})},
  {t:'Take the dressed stone',s:`+${Y.chapel} Stone · Aldous will hate it`,go:()=>beat(async()=>{const crew=['m_captain','m_banner'].filter(here);await Promise.all(crew.map((m,i)=>goTo(m,150+i*14,156,.85,1300)));
     for(let i=0;i<4;i++){A.sfx('stone');shake(150,1.2);await sleep(300)}gain({Stone:Y.chapel});await Promise.all(crew.map(m=>back(m)));loyal('m_cleric',-2,'"A house of God, Wren."');
     outcome('DRESSED STONE',`Cut and squared, and easy to carry off. +${Y.chapel} Stone.`)})},
  {t:'Say a mass for the drowned',who:'m_cleric',s:'+2 Ward',go:()=>beat(async()=>{await goTo('m_cleric',160,156,.9,1300);_sfx('prayer');fx('holy/holy-pillar',172,112);ring(172,70,'255,240,200',2200,90);await tw('bell',{lit:.8},800);await tw('bell',{lit:0},800);

/* =================================================================== the chronicle (end-of-season save) */
// A won season is written down as a chronicle: everything the next season carries forward.
// Plain versioned JSON, so the Godot/Steam build can read the same file (user://chronicle.json).
const SAVE_KEY='qe.chronicle';
function chronicle(){
  const pick=o=>JSON.parse(JSON.stringify(o));
  return {format:'quests-and-encounters/chronicle',version:1,season:1,title:'Before the Snow',difficulty:G.diff||'standard',savedAt:new Date().toISOString(),
    result:{win:!!G.win,endDay:G.endDay,maxDay:G.maxDay},
    company:{party:pick(G.party),loyal:pick(G.loyal),hurt:pick(G.hurt),eq:pick(G.eq),learned:pick(G.learned),gear:pick(G.gear)},
    stores:{res:pick(G.res),items:pick(G.items),pack:pick(G.pack)},
    ravenwick:{built:pick(G.built),refugeesIn:!!G.refugeesIn,troublesDone:pick(G.troublesDone)},
    world:{flags:pick(G.flags),visited:Object.keys(G.visited).filter(k=>G.visited[k]),done:Object.keys(G.done).filter(k=>G.done[k])}};
}
function saveChronicle(){const c=chronicle();G.saved=c;try{localStorage.setItem(SAVE_KEY,JSON.stringify(c));localStorage.setItem(SAVE_KEY+'.s'+c.season,JSON.stringify(c))}catch(e){}return c}
function loadChronicle(){try{const c=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');return c&&c.format==='quests-and-encounters/chronicle'?c:null}catch(e){return null}}
function downloadChronicle(){const c=G.saved||loadChronicle();if(!c)return;const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(c,null,2)],{type:'application/json'}));a.download=`ravenwick-season${c.season}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Chronicle saved to a file')}

function endDraw(t,layer){
  const E=G.endFX,e=(t-E.t0)*SPEED,cl=v=>Math.max(0,Math.min(1,v));
  const back=E.beacon?cl(((t-E.beacon)*SPEED)/4000):0;
  if(layer==='behind'){
    const rise=cl((e-3600)/5200)*(1-back);if(rise<=0)return;
    const y=126-rise*74,x=204;
    ctx.fillStyle='#08050e';ctx.beginPath();ctx.ellipse(x,y+56,66,56,0,0,7);ctx.fill();
    ctx.beginPath();ctx.moveTo(x-30,y+18);ctx.quadraticCurveTo(x-52,y+2,x-62,y-22);ctx.quadraticCurveTo(x-44,y-2,x-20,y+10);ctx.fill();
    ctx.beginPath();ctx.moveTo(x+30,y+18);ctx.quadraticCurveTo(x+52,y+2,x+62,y-22);ctx.quadraticCurveTo(x+44,y-2,x+20,y+10);ctx.fill();
    const g=ctx.createRadialGradient(x,y+28,0,x,y+28,34);g.addColorStop(0,`rgba(255,60,30,${.35*rise})`);g.addColorStop(1,'rgba(255,60,30,0)');ctx.fillStyle=g;ctx.fillRect(x-40,y-6,80,70);
    ctx.fillStyle=`rgba(255,90,50,${rise})`;ctx.fillRect(Math.round(x-18),Math.round(y+27),8,2);ctx.fillRect(Math.round(x+10),Math.round(y+27),8,2);
    return;
  }
  // the night darkens; on a loss it swallows Ravenwick
  const fall=E.fall?cl(((t-E.fall)*SPEED)/2400):0;
  ctx.fillStyle=`rgba(12,4,24,${Math.min(.38,e/7000*.38)*(1-back*.6)+fall*.55})`;ctx.fillRect(-10,-SY-10,CW+20,CH+20);
  for(const w of E.wr){
    if(e<w.t)continue;let p=cl((e-w.t)/6500);if(E.beacon)p*=1-back;const tx=150+(w.x0-150)*.35,ty=124;
    const x=w.x0+(tx-w.x0)*p+Math.sin(t*.002+w.ph)*2,y=w.y0+(ty-w.y0)*p,a=cl((e-w.t)/800)*(E.beacon?1-back:1);
    ctx.globalAlpha=a;ctx.fillStyle='#050308';ctx.beginPath();ctx.moveTo(x,y-w.h);ctx.lineTo(x-3.5,y);ctx.lineTo(x+3.5,y);ctx.fill();
    ctx.beginPath();ctx.arc(x,y-w.h,2,0,7);ctx.fill();ctx.fillRect(Math.round(x-4+Math.sin(t*.004+w.ph)*2),Math.round(y-2),2,1);
    ctx.fillStyle='rgba(255,70,40,.9)';ctx.fillRect(Math.round(x-1),Math.round(y-w.h),1,1);ctx.fillRect(Math.round(x+1),Math.round(y-w.h),1,1);ctx.globalAlpha=1;
  }
  for(const ey of E.eyes){if(e<ey.t)continue;const blink=Math.sin(t*.003+ey.x)>-.94;if(!blink)continue;
    ctx.fillStyle=`rgba(${ey.c},${cl((e-ey.t)/600)*(1-back)})`;ctx.fillRect(Math.round(ey.x),Math.round(ey.y),1,1);ctx.fillRect(Math.round(ey.x+3),Math.round(ey.y),1,1)}
  if(E.beacon&&box('tower')){const b=box('tower'),bx=b.x+6,by=b.y+2,f=.85+.15*Math.sin(t*.02)*Math.random();
    const g=ctx.createRadialGradient(bx,by,0,bx,by,46);g.addColorStop(0,`rgba(255,210,120,${.7*f})`);g.addColorStop(1,'rgba(255,140,60,0)');ctx.fillStyle=g;ctx.fillRect(bx-50,by-50,100,100);
    ctx.fillStyle='#fff0b0';ctx.fillRect(bx-2,by-4,4,4);ctx.fillStyle='#ffb050';ctx.fillRect(bx-3,by-1,6,2);if(Math.random()<.6)spark(bx,by-3,1,'255,200,100',.4,.5,-.01)}
  if(fall>0){ctx.fillStyle=`rgba(0,0,0,${fall*.5})`;ctx.fillRect(-10,-SY-10,CW+20,CH+20)}
}

async function showScene(scene,mood){const f=document.getElementById('fade');f.style.opacity=1;await sleep(600);O={};G.scene=scene;A.mood(mood);A.ambience((SCENE_SOUND[scene]||[0,['wind']])[1]);f.style.opacity=0;await sleep(400)}
const diffLinks=()=>`<div class="langs diff">${DIFF_ORDER.map(k=>`<a class="${G.diff===k?'on':''}" onclick="pickDiff('${k}')">${DIFF[k].name}</a>`).join('')}<div class="dd">${DIFF[G.diff].desc}</div></div>`;
function pickDiff(k){A.sfx&&A.sfx('click');setDifficulty(k);const d=document.querySelector('#story .diff');if(d)d.outerHTML=diffLinks()}
const LANGS=[['en','English'],['ru','Русский'],['es','Español']];
const langLinks=()=>`<div class="langs">${LANGS.map(([k,n])=>`<a class="${I18N.lang===k?'on':''}" onclick="setLang('${k}')">${n}</a>`).join('')}</div>`;
function setLang(k){I18N.set(k);drawLang();const l=document.querySelector('#story .langs');if(l)l.outerHTML=langLinks();render()}
function drawLang(){document.getElementById('lang').innerHTML=LANGS.map(([k,n])=>`<a class="${I18N.lang===k?'on':''}" onclick="setLang('${k}')">${k.toUpperCase()}</a>`).join('')}
function splash(){
  document.getElementById('stage').classList.add('cine');G.mode='splash';
  story(`<div class="k">A GAME OF ROADS AND WINTERS</div><h2>Quests and Encounters</h2><p>Season One · Before the Snow</p>${(c=>c?`<p style="font-size:14px;color:#b5a88e">Chronicle saved: Season ${c.season} won on day ${c.result.endDay}. Season 2 will begin from it.</p>`:'')(loadChronicle())}
    <div class="btns"><a id="b_go">Begin</a><a id="b_skipintro" class="quiet">Skip the story</a><a id="b_skipall" class="quiet">Skip story and tutorial</a></div>${langLinks()}`);
  waitPick([['b_go','all'],['b_skipintro','meet'],['b_skipall','none']]).then(async v=>{A.start();
    if(v==='none')G.tutorial=false;
    if(v==='all')await runStory();
    if(v!=='none')await meetCompany();else await showScene('ravenwick','home');
    startSeason()});
}
async function runStory(){
  for(let i=0;i<STORY.length;i++){const [sc,k,t,txt,mood]=STORY[i];unstory();await showScene(sc,mood);
    story(`<div class="k">${k}</div><h2>${t}</h2><p>${txt}</p><div class="btns"><a id="s_next">Continue ›</a><a id="s_skip" class="quiet">Skip the story</a></div>`);
    if(await waitPick([['s_next',1],['s_skip',0]])===0)break}
  unstory();if(G.scene!=='ravenwick')await showScene('ravenwick','home');
}
async function meetCompany(){
  if(G.scene!=='ravenwick')await showScene('ravenwick','home');
  G.mode='meet';story(`<div class="k">YOUR COMPANY</div><h2>Four of You</h2><p>Everything you do, one of them does. Meet them.</p><div class="btns"><a id="m_go">Meet them ›</a><a id="m_skip" class="quiet">Skip</a></div>`);
  if(await waitPick([['m_go',1],['m_skip',0]])===0){unstory();return}
  for(const m of MEMBERS){
    st(m).walk=1;tw(m,{dy:-6,lit:.35},500).then(()=>st(m).walk=0);_sfx('page');
    story(`<div class="row"><canvas width="64" height="64"></canvas><div><div class="k">${CO[m].title}</div><h2>${CO[m].name}</h2><p>${MEET[m][0]}</p><div class="sk">${MEET[m][1]}</div></div></div>
      <div class="btns"><a id="c_next">${m==='m_tracker'?'Begin the season ›':'Next ›'}</a></div>`,true);
    const pc=document.querySelector('#story canvas').getContext('2d');const im=new Image();im.onload=()=>pc.drawImage(im,0,0);im.src=PORTRAITS[m];
    await waitPick([['c_next',1]]);await tw(m,{dy:0,lit:0},400)}
  unstory();
}
function startSeason(){
  G.mode=null;G.sub=null;document.getElementById('stage').classList.remove('cine');sound();render();toast(`Day 1. ${G.maxDay} days to the first snow.`);
}

/* =================================================================== tutorial tips */
const $=q=>document.querySelector(q);
const chWith=t=>[...document.querySelectorAll('#panel .ch')].find(a=>a.innerText.includes(t));
const atHome=()=>G.scene==='ravenwick'&&!G.sub&&!G.msg;
const TIPS=[
  {k:'loyal',when:()=>G.want.loyal&&!G.busy,at:()=>$(`#party a[data-m="${G.want.loyal[0]}"]`),side:'below',
   text:()=>{const [m,d]=G.want.loyal;return `<b>${CO[m].short} ${d>0?'approves':'disapproves'}.</b> The hearts by each name are <b>loyalty</b>, from 0 to 5. Choices they like raise it, choices they dislike lower it. At 0 they leave the Company for good; at 5 they become <b>Devoted</b> and gain a bonus. Each person's likes and dislikes are on their sheet.`}},
  {k:'goal',when:atHome,at:()=>$('#goal'),side:'below',text:'<b>Your goal.</b> Build the walls, then a watchtower, before the first snow. The costs change every season.'},
  {k:'res',when:atHome,at:()=>$('#res'),side:'below',text:'<b>What you have.</b> Stone and Coin pay for building. The Company eats 1 Bread a day, and the fields only feed you when you rest at Ravenwick. Wards are Aldous’s holy light.'},
  {k:'party',when:atHome,at:()=>$('#party'),side:'below',text:'<b>Your Company.</b> Click a name, or a figure in the painting, to see their skills, gear and loyalty. Upset them, and they may leave.'},
  {k:'setout',when:atHome,at:()=>chWith('Set out'),side:'left',text:'Head through the gate to explore. Ravenwick will be here when you come back.'},
  {k:'map',when:()=>G.scene==='crossroads'&&!G.msg,at:()=>$('#map'),side:'below',text:'<b>The route map.</b> It fills in as you go. A “?” is somewhere you can see from here.'},
  {k:'roads',when:()=>G.scene==='crossroads'&&!G.msg,at:()=>$('#panel .ch'),side:'left',text:'Each road takes a day. Hover one to light up where it leads: north for stone, east for coin, west to the Fens.'},
  {k:'who',when:()=>LOC[G.scene]&&!['ravenwick','crossroads'].includes(G.scene)&&!G.msg&&!G.done[G.scene],at:()=>$('#panel .ch .who'),side:'left',text:'The gold name is <b>who acts</b>. If they’re wounded or gone, that choice is locked. Their stats matter in the tense moments.'},
  {k:'search',when:()=>!G.msg&&!!chWith('lantern-light'),at:()=>chWith('lantern-light'),side:'left',text:'<b>Free, once a visit:</b> search the painting by lantern-light for things others missed.'},
  {k:'travel',when:()=>G.msg&&!!chWith('Home to'),at:()=>$('#panel .ch'),side:'left',text:'<b>Where now?</b> Press on deeper, cross into another region, or head home. Each step is a day, and home is never more than two days away.'},
  {k:'gear',when:()=>G.want.gear&&!G.busy,at:()=>$('#party'),side:'below',text:'<b>New gear!</b> Open anyone’s sheet to see what it does, or hand it to someone else. Whoever carries it gets the skill.'},
  {k:'trouble',when:()=>atHome()&&G.trouble,at:()=>chWith('Deal with')||chWith('Speak with'),side:'left',text:'<b>Trouble at home</b> costs you every day until you deal with it. You can also click it in the painting.'},
  {k:'build',when:()=>atHome()&&(!!chWith('Build the walls')||!!chWith('Raise the watchtower'))&&!document.querySelector('#panel .ch.off')?.innerText.match(/Build|Raise/),at:()=>chWith('Build the walls')||chWith('Raise the watchtower'),side:'left',text:'You can afford it. <b>Build!</b>'},
];
let tipOn=null,tipClose=null,tipAnchor=null;
function runTips(){
  // A tip that is showing follows its target, and goes away by itself once its moment has passed
  // (the player moved on, the target left the screen, or a scene or sheet took over).
  if(tipOn){
    if(!G.tutorial||G.over||G.busy||!tipOn.when())return tipClose(true);  // its moment has passed (or the player acted): done with it
    if(G.mode||G.sheet||G.search||G.striking)return tipClose(false);       // something took over for a moment: show it again later
    const el=tipOn.at();
    if(!el||!el.getClientRects().length)return tipClose(false);
    if(el!==tipAnchor){tipAnchor.style.outline='';tipAnchor=el;el.style.outline='2px solid rgba(255,210,122,.8)';el.style.outlineOffset='4px'}  // the panel was redrawn
    placeTip(tipOn,el);return;
  }
  if(!G.tutorial||G.mode||G.busy||G.over||G.sheet||G.search||G.striking)return;
  const t=TIPS.find(t=>!G.tips[t.k]&&t.when());if(!t)return;const el=t.at();if(!el)return;
  showTip(t,el);
}
function showTip(t,anchor){
  tipOn=t;tipAnchor=anchor;const tip=$('#tip');
  tip.innerHTML=`<div class="arr"></div>${typeof t.text==='function'?t.text():t.text}<div class="tb"><a class="quiet" id="tipskip">Skip tutorial</a><a id="tipok">Got it</a></div>`;tip.style.display='block';
  placeTip(t,anchor);
  anchor.style.outline='2px solid rgba(255,210,122,.8)';anchor.style.outlineOffset='4px';
  const close=tipClose=(seen=true)=>{(tipAnchor||anchor).style.outline='';tip.style.display='none';tipOn=tipClose=tipAnchor=null;if(!seen)return;G.tips[t.k]=1;if(t.k==='gear')G.want.gear=0;if(t.k==='loyal')G.want.loyal=0;setTimeout(runTips,250)};
  $('#tipok').onclick=()=>{_sfx('click');close()};
  $('#tipskip').onclick=()=>{_sfx('click');G.tutorial=false;close()};
}
function placeTip(t,anchor){
  const tip=$('#tip'),stage=$('#stage'),sr=stage.getBoundingClientRect(),k=sr.width/1280,r=anchor.getBoundingClientRect();
  const ax=(r.left-sr.left)/k,ay=(r.top-sr.top)/k,aw=r.width/k,ah=r.height/k;
  const tw_=tip.offsetWidth,th=tip.offsetHeight,arr=tip.querySelector('.arr');arr.style.border='';
  let x,y;
  if(t.side==='below'){x=Math.max(16,Math.min(1280-tw_-16,ax+aw/2-tw_/2));y=ay+ah+14;arr.style.left=(ax+aw/2-x-7)+'px';arr.style.top='-8px';arr.style.borderRight=arr.style.borderBottom='none'}
  else{x=ax-tw_-20;y=Math.max(16,Math.min(720-th-16,ay+ah/2-th/2));arr.style.left=(tw_-9)+'px';arr.style.top=(ay+ah/2-y-7)+'px';arr.style.borderLeft=arr.style.borderBottom='none'}
  tip.style.left=x+'px';tip.style.top=y+'px';
}
setInterval(runTips,400);

/* =================================================================== render */
let hurtSeen={};
function render(){
  for(const m in G.hurt)if(!hurtSeen[m]&&here(m)){const [hx,hy]=head(m);spark(hx,hy+4,14,'220,60,40',.7,.2);shake(250,1.2)}hurtSeen={...G.hurt};
  if(G.mode||!S[G.scene]){document.getElementById('panel').innerHTML='';return}
  let sc=S[G.scene]();
  if(G.scene!=='ravenwick'&&G.scene!=='crossroads'&&!G.msg&&G.done[G.scene])sc=quiet(G.scene);
  if(!G.msg&&LOC[G.scene]&&G.scene!=='ravenwick'&&G.scene!=='crossroads')sc={...sc,ch:[...searchOption(),...roadOptions(),...sc.ch]};
  if(G.msg){const m=G.msg;const travel=LOC[G.scene]&&G.scene!=='ravenwick'&&G.scene!=='crossroads'&&!m.stay;
    sc={kind:m.kind||sc.kind,title:m.title||sc.title,body:m.body,barks:m.barks,cap:travel?'Where now?':'',
      ch:travel?travelOptions(G.scene).map(o=>({...o,go:()=>{G.msg=null;o.go()}})):[{t:'Continue',s:'',go:()=>{A.sfx('click');G.msg=null;
      if(G.scene==='ravenwick'&&G.built.tower&&!G.over)startEnd(true);else render()}}]}}
  const p=document.getElementById('panel');
  const barks=(sc.barks||[]).map(([m,l])=>`<div class="bark">${m?`<b>${nm(m)}:</b> `:''}${l}</div>`).join('');
  p.innerHTML=(sc.kind?`<div class="kind">${sc.kind}</div>`:'')+(sc.title?`<h1>${sc.title}</h1>`:'')+`<div class="body">${sc.body}</div>${barks}<div class="cap">${sc.cap||''}</div>`+
    sc.ch.map((c,i)=>{if('who' in c&&!c.who)return `<a class="ch off">${c.t}<small>No one in the Company can do this now</small></a>`;const lockWho=c.who&&!has(c.who),lock=lockWho||!can(c.c);
      const why=lockWho?(G.party[c.who]==='gone'?`${nm(c.who)} is gone`:`${nm(c.who)} is wounded`):(!can(c.c)?'Needs '+cost(c.c):'');
      return `<a class="ch ${lock?'off':''}" data-i="${i}">${c.who?`<span class="who">${nm(c.who)}:</span> `:''}${c.t}${(why||c.s)?`<small>${why||c.s}</small>`:''}</a>`}).join('');
  p.querySelectorAll('.ch').forEach(a=>{const c=sc.ch[+a.dataset.i];a.onclick=()=>{if(!G.busy)c.go()};a.onmouseenter=()=>{G.hover=c.hover||c.who||null;A.sfx('hover')};a.onmouseleave=()=>G.hover=null});
  document.getElementById('res').innerHTML=Object.entries(G.res).map(([k,v])=>`<span class="${k==='Bread'&&v<=1?'lo':''}">${k} <b>${v}</b></span>`).join('');
  const left=G.maxDay-G.day;
  const needS=(G.built.walls?0:costOf('walls').Stone)+(G.built.tower?0:costOf('tower').Stone)-G.res.Stone,needC=(G.built.walls?0:COST.walls.Coin)+(G.built.tower?0:COST.tower.Coin)-G.res.Coin;
  const stepW=G.built.walls?'<span class="done">✓ Walls</span>':`<span class="now">① Walls</span> <span class="step">(${cost(costOf('walls'))})</span>`;
  const stepT=G.built.tower?'<span class="done">✓ Watchtower</span>':`<span class="${G.built.walls?'now':'step'}">② Watchtower</span> <span class="step">(${cost(costOf('tower'))})</span>`;
  document.getElementById('goal').innerHTML=`<div class="big">Day ${Math.min(G.day,G.maxDay)} of ${G.maxDay} · ${left>0?left+' days to the first snow':'the snow is here'}</div>`+
    `<div class="sm">${stepW} → ${stepT}</div>`+(G.built.tower?'':`<div class="sm">still to find: ${Math.max(0,needS)} Stone, ${Math.max(0,needC)} Coin</div>`);
  drawMap();
  document.getElementById('party').innerHTML=MEMBERS.map(m=>{const g=G.party[m]==='gone',h=G.hurt[m],pl=(G.pulse[m]||0)>performance.now()-1600;
    return `<a data-m="${m}" class="${g?'gone':h?'hurt':''}${pl?' pulse':''}" onclick="openSheet('${m}')">${nm(m)}${h?' (wounded)':''}${CO[m].loyal!==null&&!g?`<span class="pips">${'♥'.repeat(G.loyal[m])}<i>${'♥'.repeat(5-G.loyal[m])}</i></span>`:''}</a>`}).join('');
  {const gear=MEMBERS.flatMap(m=>G.eq[m]).length+G.pack.length;if(gear||G.items.length)document.getElementById('party').innerHTML+=`<span style="font-style:italic;color:#e8c98a">· ${gear} gear, ${G.items.length} stores${G.pack.length?` (${G.pack.length} unequipped)`:''}</span>`;}
}
const fit=()=>document.getElementById('stage').style.setProperty('--k',Math.min(innerWidth/1280,innerHeight/720));addEventListener('resize',fit);fit();
const h=new URLSearchParams(location.hash.slice(1));if(h.get('scene')){G.scene=h.get('scene');G.sub=h.get('sub')}if(h.get('trouble'))G.trouble=h.get('trouble');if(h.get('day'))G.day=+h.get('day');
window.G=G;I18N.start();drawLang();render();requestAnimationFrame(loop);
const testing=h.get('scene')||h.get('bot')||h.get('end');
if(testing){G.mode=null;G.tutorial=false;if(!h.get('scene'))G.scene='ravenwick';render();if(!h.get('still'))(async()=>{busy(true);await walkIn();busy(false);render()})()}
else splash();
if(h.get('end')){G.built.walls=1;G.built.tower=h.get('end')==='win'?1:0;setTimeout(()=>startEnd(h.get('end')==='win'),300)}
</script></body></html>
